buildscript {
    repositories {
        maven { url "https://maven.minecraftforge.net/" }
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://libraries.minecraft.net/" }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:1.2-SNAPSHOT'
    }
}

apply plugin: 'forge'

version = "1.0"
group = "com.example.justculling"
archivesBaseName = "justculling"

minecraft {
    version = "1.8.8-11.15.1.2318-1.8.8"
    runDir = "run"
    mappings = "stable_12"
}

processResources {
    inputs.property "version", project.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand([version: project.version, mcversion: '1.8.8'])
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

task printVersions {
    doLast {
        logger.lifecycle("Gradle: " + gradle.gradleVersion)
        logger.lifecycle("Java: " + System.getProperty("java.version"))
        logger.lifecycle("Forge: " + project.minecraft.version)
    }
}

task wrapper(type: Wrapper) {
    gradleVersion = '2.14.1'
    distributionType = Wrapper.DistributionType.BIN
}
