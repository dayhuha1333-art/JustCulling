buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
        maven {
            url = "https://jitpack.io"
        }
    }
    dependencies {
        // Форк ForgeGradle 1.2 от anatawa12, который не зависит от мёртвого MCPBot
        classpath "com.anatawa12.forge:ForgeGradle:1.2-1.0.0"
    }
}

apply plugin: 'forge'

version = "1.0"
group = "com.example.justculling"
archivesBaseName = "justculling"

minecraft {
    version = "1.8.8-11.15.1.2318-1.8.8"
    runDir = "run"
    mappings = "snapshot_nodoc_20141130"
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

task printVersions {
    doLast {
        println "Gradle: " + gradle.gradleVersion
        println "Java: " + System.getProperty("java.version")
        println "Forge: " + project.minecraft.version
    }
}
