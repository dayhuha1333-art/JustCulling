apply plugin: 'java'

version = "1.0"
group = "com.example.justculling"
archivesBaseName = "justculling"

sourceCompatibility = 1.8
targetCompatibility = 1.8

repositories {
    mavenCentral()
}

dependencies {
    // Положите forge-1.8.8-11.15.1.2318-1.8.8-universal.jar в папку libs/
    compileOnly files('libs/forge-1.8.8-11.15.1.2318-1.8.8-universal.jar')
}

// Копируем mcmod.info в jar
processResources {
    inputs.property "version", project.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': '1.8.8'
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

task printVersions {
    doLast {
        println "Gradle: " + gradle.gradleVersion
        println "Java: " + System.getProperty("java.version")
    }
}
