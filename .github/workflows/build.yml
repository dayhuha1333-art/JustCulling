name: Build JustCulling

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Download Gradle 2.14.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle-2.14.1-bin.zip
          echo "$PWD/gradle-2.14.1/bin" >> $GITHUB_PATH

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/gradle.properties') || 'nogradle' }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build with Gradle
        run: |
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          gradle printVersions build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: justculling-jar
          path: build/libs/justculling-*.jar
          if-no-files-found: error
